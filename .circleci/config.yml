# Release-only pipeline for the Sumigoe GitHub release repo.
#
# Triggered by the Tangled tag workflow via CircleCI API v3 with:
#   { "tag": "vX.Y.Z", "sha": "<tangled commit>" }
#
# Required project environment variables:
#   TANGLED_CLONE_URL = https://tangled.org/did:plc:tbfeuv4fpbqfthcu7a227s4x
#   GH_TOKEN          = fine-grained PAT with Contents: Read and write
#
# Android release signing (project variables, all masked):
#   ANDROID_KEYSTORE_BASE64    = base64 of the release .jks
#   ANDROID_KEYSTORE_PASSWORD  = keystore password
#   ANDROID_KEY_ALIAS          = key alias inside the keystore
#   ANDROID_KEY_PASSWORD       = key password (PKCS12: same as the store password)
#
# No source is checked out from this repo; every build job clones Tangled.

version: 2.1

orbs:
  gh: circleci/github-cli@3.0.0

parameters:
  tag:
    type: string
    default: ""
  sha:
    type: string
    default: ""

jobs:
  build-linux:
    docker:
      - image: ubuntu:24.04
    steps:
      - run:
          name: Validate release parameters
          command: |
            set -euo pipefail
            printf '%s' '<< pipeline.parameters.tag >>' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
            printf '%s' '<< pipeline.parameters.sha >>' | grep -Eq '^[0-9a-f]{40,64}$'
      - run:
          name: Install system dependencies, Rust, and Node
          command: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive

            apt-get update
            apt-get install -y \
              build-essential pkg-config curl wget file lld git \
              ca-certificates gnupg \
              libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
              libjavascriptcoregtk-4.1-dev libxdo-dev libssl-dev \
              libayatana-appindicator3-dev librsvg2-dev \
              libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
              libclang-dev patchelf

            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain 1.99.0
            source "$HOME/.cargo/env"
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"

            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
      - run:
          name: Clone Tangled
          command: |
            set -euo pipefail
            git clone --filter=blob:none "$TANGLED_CLONE_URL" src
            cd src
            git fetch --depth 1 origin '<< pipeline.parameters.sha >>'
            git checkout FETCH_HEAD
      - run:
          name: Fetch models and install npm dependencies
          command: |
            set -euo pipefail
            cd src
            curl -fL --retry 3 -o assets/tracker.onnx \
              https://public-oss.sbeam.dev/sumigoe-models/tracker.onnx
            curl -fL --retry 3 -o assets/crepe-medium.onnx \
              https://public-oss.sbeam.dev/sumigoe-models/crepe-medium.onnx
            echo "b5ba0a06ad8e91fd5d73a3e38ef637c7b84808e08f575f7f1a5c57d20083c263  assets/tracker.onnx" | sha256sum -c -
            echo "f7f6f78022f9e6d51506554393bcd88d4f9ae787e060a8f4aafeb2019f0fb939  assets/crepe-medium.onnx" | sha256sum -c -
            npm ci
      - run:
          name: Install dx
          command: |
            set -euo pipefail
            curl -L --proto '=https' --tlsv1.2 -sSf \
              https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
            cargo binstall -y dioxus-cli@0.7.10
      - run:
          name: Bundle Linux
          command: |
            set -euo pipefail
            cd src
            dx bundle --release --linux \
              --no-default-features --features linux \
              --package-types deb --package-types appimage \
              --out-dir ../dist/linux
      - persist_to_workspace:
          root: .
          paths: [dist/linux]

  build-macos:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    steps:
      - run:
          name: Select Node 22
          command: |
            nvm install 22
            nvm alias default 22
      - run:
          name: Install Rust
          command: |
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain 1.99.0
            fi
            if [ -f "$HOME/.cargo/env" ]; then
              source "$HOME/.cargo/env"
            fi
            rustup toolchain install 1.99.0 --profile minimal
            rustup default 1.99.0
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"
      - run:
          name: Clone Tangled
          command: |
            set -euo pipefail
            git clone --filter=blob:none "$TANGLED_CLONE_URL" src
            cd src
            git fetch --depth 1 origin '<< pipeline.parameters.sha >>'
            git checkout FETCH_HEAD
      - run:
          name: Fetch models and install npm dependencies
          command: |
            set -euo pipefail
            cd src
            curl -fL --retry 3 -o assets/tracker.onnx \
              https://public-oss.sbeam.dev/sumigoe-models/tracker.onnx
            curl -fL --retry 3 -o assets/crepe-medium.onnx \
              https://public-oss.sbeam.dev/sumigoe-models/crepe-medium.onnx
            echo "b5ba0a06ad8e91fd5d73a3e38ef637c7b84808e08f575f7f1a5c57d20083c263  assets/tracker.onnx" | sha256sum -c -
            echo "f7f6f78022f9e6d51506554393bcd88d4f9ae787e060a8f4aafeb2019f0fb939  assets/crepe-medium.onnx" | sha256sum -c -
            npm ci
      - run:
          name: Install dx
          command: |
            set -euo pipefail
            curl -L --proto '=https' --tlsv1.2 -sSf \
              https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
            cargo binstall -y dioxus-cli@0.7.10
      - run:
          name: Bundle macOS
          command: |
            set -euo pipefail
            cd src

            bash scripts/gen-macos-plist.sh

            dx bundle --release --macos \
              --no-default-features --features macos \
              --package-types macos \
              --out-dir ../dist/macos

            APP=$(find ../dist/macos -maxdepth 1 -name '*.app' -print -quit)
            test -n "$APP"

            /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Contents/Info.plist"
            codesign --verify --deep --verbose=2 "$APP"

            VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
            test -n "$VERSION"

            STAGE=$(mktemp -d)
            ditto "$APP" "$STAGE/$(basename "$APP")"
            ln -s /Applications "$STAGE/Applications"

            hdiutil create \
              -volname "Sumigoe" \
              -srcfolder "$STAGE" \
              -ov \
              -format UDZO \
              "../dist/macos/Sumigoe_${VERSION}_aarch64.dmg"
      - persist_to_workspace:
          root: .
          paths: [dist/macos]

  build-windows:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - run:
          name: Validate release parameters
          command: |
            if ('<< pipeline.parameters.tag >>' -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$') {
              throw 'invalid release tag'
            }
            if ('<< pipeline.parameters.sha >>' -notmatch '^[0-9a-f]{40,64}$') {
              throw 'invalid release sha'
            }
      - run:
          name: Install Rust
          command: |
            Invoke-WebRequest -Uri https://win.rustup.rs -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain 1.99.0
            $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
      - run:
          name: Ensure Node.js
          command: |
            if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
              choco install nodejs-lts -y
              $env:Path = "C:\Program Files\nodejs;$env:Path"
            }
      - run:
          name: Clone Tangled
          command: |
            $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
            git clone $env:TANGLED_CLONE_URL src
            Set-Location src
            git fetch --depth 1 origin '<< pipeline.parameters.sha >>'
            git checkout FETCH_HEAD
      - run:
          name: Fetch models and install npm dependencies
          command: |
            Set-Location src
            curl.exe -fL --retry 3 -o assets/tracker.onnx https://public-oss.sbeam.dev/sumigoe-models/tracker.onnx
            curl.exe -fL --retry 3 -o assets/crepe-medium.onnx https://public-oss.sbeam.dev/sumigoe-models/crepe-medium.onnx

            $tracker = (Get-FileHash assets/tracker.onnx -Algorithm SHA256).Hash.ToLower()
            if ($tracker -ne 'b5ba0a06ad8e91fd5d73a3e38ef637c7b84808e08f575f7f1a5c57d20083c263') {
              throw "tracker.onnx checksum mismatch: $tracker"
            }
            $crepe = (Get-FileHash assets/crepe-medium.onnx -Algorithm SHA256).Hash.ToLower()
            if ($crepe -ne 'f7f6f78022f9e6d51506554393bcd88d4f9ae787e060a8f4aafeb2019f0fb939') {
              throw "crepe-medium.onnx checksum mismatch: $crepe"
            }

            npm ci
      - run:
          name: Install dx
          command: |
            $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
            Set-ExecutionPolicy Bypass -Scope Process -Force
            iex ((New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.ps1'))
            cargo binstall -y dioxus-cli@0.7.10
      - run:
          name: Bundle Windows
          command: |
            $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
            Set-Location src
            dx bundle --release --windows `
              --no-default-features --features windows `
              --package-types msi --package-types nsis `
              --out-dir ..\dist\windows
      - persist_to_workspace:
          root: .
          paths: [dist/windows]

  build-android:
    docker:
      # SDK, build-tools and JDK are preinstalled; -ndk adds the NDK. No emulator
      # is needed, so the Docker executor is enough (no nested virtualization).
      - image: cimg/android:2026.10.1-ndk
    resource_class: large
    environment:
      # Android only: statically link libc++ into libmain.so. dx never packages
      # libc++_shared.so, so the shared default would crash at startup.
      ORT_CXX_STDLIB: c++_static
      # AGP's JdkImageTransform parses `jlink --version`; JVM cgroup warnings on
      # stdout break it.
      JAVA_TOOL_OPTIONS: "-Xlog:os+container=off"
    steps:
      - run:
          name: Validate release parameters
          command: |
            set -euo pipefail
            printf '%s' '<< pipeline.parameters.tag >>' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
            printf '%s' '<< pipeline.parameters.sha >>' | grep -Eq '^[0-9a-f]{40,64}$'
      - run:
          name: Resolve Android SDK paths
          command: |
            set -euo pipefail
            if [ -z "${ANDROID_HOME:-}" ]; then
              for candidate in /opt/android/sdk "$HOME/android-sdk"; do
                if [ -d "$candidate" ]; then ANDROID_HOME="$candidate"; break; fi
              done
            fi
            test -n "${ANDROID_HOME:-}" || { echo "no Android SDK found" >&2; exit 1; }
            export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
            echo "export ANDROID_HOME=$ANDROID_HOME" >> "$BASH_ENV"
            echo "export ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$BASH_ENV"

            if [ -z "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_HOME/ndk" ]; then
              ndk="$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n1)"
              if [ -n "$ndk" ]; then
                echo "export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$BASH_ENV"
              fi
            fi

            # dx generates compileSdk/targetSdk 34 with AGP 8.7; make sure the
            # SDK packages exist instead of discovering it mid-build.
            missing=()
            [ -d "$ANDROID_HOME/platforms/android-34" ] || missing+=("platforms;android-34")
            ls -d "$ANDROID_HOME"/build-tools/34.* >/dev/null 2>&1 || missing+=("build-tools;34.0.0")
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "installing: ${missing[*]}"
              yes | sdkmanager --licenses >/dev/null 2>&1 || true
              sdkmanager "${missing[@]}"
            fi

            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-unset}"
            echo "JAVA_HOME=${JAVA_HOME:-unset}"
            java -version
            ls -1 "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/ndk" 2>/dev/null || true
      - run:
          name: Install Rust and the Android target
          command: |
            set -euo pipefail
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain 1.99.0
            source "$HOME/.cargo/env"
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"
            rustup target add aarch64-linux-android
      - run:
          name: Clone Tangled
          command: |
            set -euo pipefail
            git clone --filter=blob:none "$TANGLED_CLONE_URL" src
            cd src
            git fetch --depth 1 origin '<< pipeline.parameters.sha >>'
            git checkout FETCH_HEAD
      - run:
          name: Fetch models
          command: |
            set -euo pipefail
            cd src
            curl -fL --retry 3 -o assets/tracker.onnx \
              https://public-oss.sbeam.dev/sumigoe-models/tracker.onnx
            curl -fL --retry 3 -o assets/crepe-medium.onnx \
              https://public-oss.sbeam.dev/sumigoe-models/crepe-medium.onnx
            echo "b5ba0a06ad8e91fd5d73a3e38ef637c7b84808e08f575f7f1a5c57d20083c263  assets/tracker.onnx" | sha256sum -c -
            echo "f7f6f78022f9e6d51506554393bcd88d4f9ae787e060a8f4aafeb2019f0fb939  assets/crepe-medium.onnx" | sha256sum -c -
      - run:
          name: Install dx
          command: |
            set -euo pipefail
            curl -L --proto '=https' --tlsv1.2 -sSf \
              https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
            cargo binstall -y dioxus-cli@0.7.10
      - run:
          name: Configure release signing
          command: |
            set -euo pipefail
            cd src
            scripts/ci/android-signing.sh
      - run:
          name: Bundle Android
          # The Rust release build is quiet while linking.
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            cd src
            scripts/build-android.sh --release \
              --target aarch64-linux-android \
              --dist ../dist/android
      - run:
          name: Verify APK
          command: |
            set -euo pipefail
            apk="$(find dist/android -name '*.apk' -print -quit)"
            test -n "$apk"

            aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n1)"
            apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)"
            test -n "$aapt2"
            test -n "$apksigner"

            "$aapt2" dump badging "$apk" > /tmp/badging.txt
            cat /tmp/badging.txt

            # versionName comes from Cargo.toml; ignore a -test/-rc tag suffix.
            VERSION='<< pipeline.parameters.tag >>'
            VERSION="${VERSION#v}"
            VERSION="${VERSION%%[-+]*}"
            grep -q "versionName='${VERSION}'" /tmp/badging.txt
            grep -q "package: name='dev.sbeam.sumigoe'" /tmp/badging.txt
            grep -q "uses-permission: name='android.permission.RECORD_AUDIO'" /tmp/badging.txt

            # Single ABI only: dx never cleans jniLibs, so a stale target/ tree
            # could silently add another ABI and break installs.
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libmain\.so'
            ! unzip -l "$apk" | grep -q 'lib/x86_64/'
            unzip -l "$apk" | grep -q 'assets/tracker-.*\.onnx'

            "$apksigner" verify --print-certs "$apk"
      - persist_to_workspace:
          root: .
          paths: [dist/android]

  publish:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: .
      - gh/install
      - run:
          name: Generate release notes and checksums
          command: |
            set -euo pipefail
            TAG='<< pipeline.parameters.tag >>'
            SHA='<< pipeline.parameters.sha >>'

            printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
            printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40,64}$'

            git clone "$TANGLED_CLONE_URL" src
            cd src
            git fetch --tags --force --depth 200 origin

            PREV=$(git describe --tags --abbrev=0 "${SHA}^" 2>/dev/null || true)
            {
              echo "Tangled tag: https://tangled.org/did:plc:tbfeuv4fpbqfthcu7a227s4x/tags/$TAG"
              echo "Tangled commit: https://tangled.org/did:plc:tbfeuv4fpbqfthcu7a227s4x/commit/$SHA"
              echo
              if [ -n "$PREV" ]; then
                git log --pretty=format:'- %s' "$PREV..$SHA"
              else
                git log --pretty=format:'- %s' "$SHA"
              fi
            } > ../notes.md

            cd ..
            (cd dist && find . -type f \
              ! -name 'default._*' ! -name '._*' \
              \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.apk' \) \
              -print0 | sort -z | xargs -0 sha256sum | sed -E 's#  \./[^/]+/#  #') > dist/SHA256SUMS
      - run:
          name: Publish GitHub release
          command: |
            set -euo pipefail
            TAG='<< pipeline.parameters.tag >>'
            export GH_TOKEN

            mapfile -t files < <(find dist -type f \
              ! -name 'default._*' ! -name '._*' \
              \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.apk' -o -name 'SHA256SUMS' \) | sort)

            test "${#files[@]}" -gt 0

            if gh release view "$TAG" --repo sbeam-dev/sumigoe >/dev/null 2>&1; then
              gh release upload "$TAG" "${files[@]}" --repo sbeam-dev/sumigoe --clobber
              gh release edit "$TAG" --repo sbeam-dev/sumigoe --notes-file notes.md
            else
              gh release create "$TAG" "${files[@]}" \
                --repo sbeam-dev/sumigoe \
                --title "Sumigoe $TAG" \
                --notes-file notes.md \
                --target main
            fi

workflows:
  release:
    jobs:
      - build-linux
      - build-macos
      - build-windows
      - build-android
      - publish:
          requires:
            - build-linux
            - build-macos
            - build-windows
            - build-android
